<!doctype html>
<html lang="es">
<head>

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: una sola columna estrecha tipo libreta de gimnasio. Tabs arriba, contenido debajo. */
:root {
  --bg: #e9ecef;
  --surface: #ffffff;
  --surface-2: #f3f5f7;
  --ink: #12171c;
  --muted: #5d6873;
  --line: #d5dae0;
  --accent: #6d3fd1;
  --accent-ink: #ffffff;
  --good: #1e8a4c;
  --warn: #b7791f;
  --g-pierna: #d9822b;
  --g-pecho: #d4453b;
  --g-hombro: #c2478a;
  --g-triceps: #2f8fb8;
  --g-biceps: #2f9d68;
  --g-espalda: #4d63c9;
  --g-antebrazo: #a8901f;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1215; --surface: #171c20; --surface-2: #1f262b; --ink: #eef1f3; --muted: #93a0aa;
    --line: #2b343b; --accent: #a78bfa; --accent-ink: #170b33; --good: #4cc58a; --warn: #e0a84a;
    --g-pierna: #f0a04b; --g-pecho: #f0675d; --g-hombro: #ec82b8; --g-triceps: #5fb6dc; --g-biceps: #55c78f; --g-espalda: #7e92ef; --g-antebrazo: #dcc44f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1215; --surface: #171c20; --surface-2: #1f262b; --ink: #eef1f3; --muted: #93a0aa;
  --line: #2b343b; --accent: #a78bfa; --accent-ink: #170b33; --good: #4cc58a; --warn: #e0a84a;
  --g-pierna: #f0a04b; --g-pecho: #f0675d; --g-hombro: #ec82b8; --g-triceps: #5fb6dc; --g-biceps: #55c78f; --g-espalda: #7e92ef; --g-antebrazo: #dcc44f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  padding-block: 12px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; text-transform: uppercase; letter-spacing: .04em; }
h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 18px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top .sub { color: var(--muted); font-size: 13px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.tab { border: 0; background: transparent; padding: 9px 4px; border-radius: 7px; font-family: var(--font-display); font-weight: 600; font-size: 17px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--accent); }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn { border: 1px solid var(--line); background: var(--surface-2); width: 34px; height: 34px; border-radius: 8px; font-size: 16px; line-height: 1; display: inline-grid; place-items: center; flex: none; }
input[type=text], input[type=number], input[type=date], select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input::placeholder { color: var(--muted); opacity: .75; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
.g-pierna { --gc: var(--g-pierna); } .g-pecho { --gc: var(--g-pecho); } .g-hombro { --gc: var(--g-hombro); }
.g-antebrazo { --gc: var(--g-antebrazo); } .g-triceps { --gc: var(--g-triceps); } .g-biceps { --gc: var(--g-biceps); } .g-espalda { --gc: var(--g-espalda); }
.dot.g { background: var(--gc); }
/* calendario */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h2 { text-align: center; flex: 1; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding-bottom: 2px; }
.day { aspect-ratio: 1 / 1.05; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-family: var(--font-display); font-weight: 600; font-size: 17px; min-width: 0; }
.day.blank { visibility: hidden; border: 0; }
.day.today { border-color: var(--accent); }
.day.sel { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 8px; }
.dots .dot { width: 6px; height: 6px; }
/* ejercicio en el día */
.ex { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--gc, var(--muted)); }
.ex-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.1; }
.tag { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.setshead { display: grid; grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr) 34px 34px; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-align: center; }
.set { display: grid; grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr) 34px 34px; gap: 6px; align-items: center; }
.set .n { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.set input { text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 600; padding: 6px 4px; }
.hint { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); margin-top: -2px; font-variant-numeric: tabular-nums; }
.hint b { color: var(--ink); font-weight: 600; }
.up { color: var(--good); font-weight: 700; }
.drop-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dropbox { grid-column: 1 / -1; display: grid; grid-template-columns: 26px minmax(0,1fr) minmax(0,1fr) 34px; gap: 6px; align-items: center; padding-left: 0; border-left: 2px solid var(--accent); margin-left: 12px; padding-left: 8px; }
.dropbox .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; line-height: 1.1; }
.sets { display: flex; flex-direction: column; gap: 8px; }
.prevbox { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; background: var(--surface-2); }
.pill.ok { color: var(--good); } .pill.warn { color: var(--warn); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.wdays { display: flex; flex-direction: column; gap: 6px; }
.wday { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 8px; }
.wday.today .nm { color: var(--accent); font-weight: 700; }
.wday input { text-align: right; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
/* modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.confirm { border: 2px solid var(--accent); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 12px; font-weight: 500; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; z-index: 30; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.exlist { display: flex; flex-wrap: wrap; gap: 6px; }
.chip .x { border: 0; background: none; padding: 0 0 0 2px; color: var(--muted); font-size: 15px; line-height: 1; }
.addrow { display: grid; grid-template-columns: 120px minmax(0,1fr) auto; gap: 8px; }
@media (max-width: 420px) { .addrow { grid-template-columns: 1fr 1fr; } .addrow .btn { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .day { transition: background-color .12s, color .12s; } }
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <h1>Sobrecarga</h1>
    <span class="sub" id="status"></span>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="app"></div>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>

(function () {
  "use strict";
  var GROUPS = [
    ["pierna", "Pierna"], ["pecho", "Pecho"], ["hombro", "Hombro"],
    ["triceps", "Tríceps"], ["biceps", "Bíceps"], ["espalda", "Espalda"], ["antebrazo", "Antebrazo"]
  ];
  var GNAME = {}; GROUPS.forEach(function (g) { GNAME[g[0]] = g[1]; });
  var MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var DAYS = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
  var STARTER = {
    pierna: ["Sentadilla", "Prensa de piernas", "Peso muerto rumano", "Extensión de cuádriceps", "Curl femoral", "Elevación de gemelos"],
    pecho: ["Press banca", "Press inclinado con mancuernas", "Aperturas en polea", "Fondos en paralelas"],
    hombro: ["Press militar", "Elevaciones laterales", "Pájaros"],
    triceps: ["Extensión en polea", "Press francés", "Fondos en banco"],
    biceps: ["Curl con barra", "Curl martillo", "Curl predicador"],
    antebrazo: ["Curl de muñeca", "Curl inverso", "Paseo del granjero"],
    espalda: ["Dominadas", "Remo con barra", "Jalón al pecho", "Remo en polea baja"]
  };

  /* ---------- utilidades ---------- */
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (k === "value") e.value = v;
      else e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
    return e;
  }
  function add(e, k) {
    if (k == null || k === false) return;
    if (Array.isArray(k)) k.forEach(function (x) { add(e, x); });
    else e.appendChild(typeof k === "object" ? k : document.createTextNode(String(k)));
  }
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseIso(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); }
  function weekStartOf(s) { var d = parseIso(s); return addDays(s, -((d.getDay() - S.cfg.startDay + 7) % 7)); }
  function fmt(n, dec) {
    if (n == null || isNaN(n)) return "–";
    var s = dec != null ? n.toFixed(dec) : String(Math.round(n * 100) / 100);
    return s.replace(".", ",");
  }
  function sgn(n, dec) { return (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n), dec); }
  function parseNum(v) {
    v = String(v).trim().replace(",", ".");
    if (v === "") return null;
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  function longDate(s) {
    var d = parseIso(s);
    return DAYS[(d.getDay() + 6) % 7] + " " + d.getDate() + " de " + MONTHS[d.getMonth()];
  }
  function shortDate(s) { var d = parseIso(s); return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3); }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- estado ---------- */
  var TODAY = iso(new Date());
  var S = {
    tab: "cal",
    month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    sel: TODAY,
    ex: [], routines: [], workouts: {}, weights: {}, weeks: {}, cfg: { mode: "deficit", startDay: 1, start: {} },
    weekStart: null,
    modal: null, pickGroup: "pierna",
    re: null, confirmDel: null,
    loaded: {}, slow: false
  };
  S.weekStart = weekStartOf(TODAY);
  var db = null;

  /* ---------- guardado ---------- */
  var timers = {}, chains = {}, dirty = {};
  function saveLater(key, delay, fn) {
    dirty[key] = true;
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () {
      timers[key] = null;
      chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(function () {
        toast("No se pudo guardar. Revisa la conexión.");
      }).then(function () { if (!timers[key]) delete dirty[key]; });
    }, delay);
  }
  function saveWorkout(date) {
    saveLater("w:" + date, 500, function () {
      var w = S.workouts[date];
      var ref = db.doc("workouts/" + date);
      if (!w || !w.exercises.length) return ref.delete();
      var o = { date: date, exercises: JSON.parse(JSON.stringify(w.exercises)) };
      if (w.routine) o.routine = w.routine;
      return ref.set(o);
    });
  }
  function entry(date) {
    if (!S.workouts[date]) S.workouts[date] = { date: date, exercises: [] };
    return S.workouts[date];
  }

  /* ---------- render con foco seguro ---------- */
  var pending = false;
  function softRender() {
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "SELECT") && document.getElementById("app").contains(a)) { pending = true; return; }
    render();
  }
  document.addEventListener("focusout", function () {
    if (pending) setTimeout(function () {
      var a = document.activeElement;
      if (!a || a.tagName !== "INPUT") { pending = false; render(); }
    }, 60);
  });

  function render() {
    pending = false;
    var y = window.scrollY;
    renderTabs();
    var app = document.getElementById("app");
    app.textContent = "";
    var ready = ["ex", "routines", "workouts", "weights", "weeks", "cfg"].every(function (k) { return S.loaded[k]; });
    if (S.login === "config") {
      app.appendChild(h("div", { class: "card" }, h("h3", null, "Falta configurar Firebase"),
        h("p", { class: "muted" }, "Abre el archivo firebase-config.js y pega tu configuraci\u00f3n de Firebase (mira el paso a paso en el README).")));
    } else if (S.login === "needed") {
      app.appendChild(h("div", { class: "card", style: "align-items:flex-start" }, h("h2", null, "Entrar"),
        h("p", { class: "muted", style: "margin:0" }, "Inicia sesi\u00f3n con tu cuenta de Google para ver y guardar tus entrenos en cualquier dispositivo."),
        h("button", { class: "btn primary", onclick: signIn }, "Entrar con Google")));
    } else if (!db && !S.booted) {
      app.appendChild(h("div", { class: "card muted" }, "Cargando…"));
    } else if (!db) {
      app.appendChild(h("div", { class: "card" }, h("h3", null, "No se pueden guardar datos"),
        h("p", { class: "muted" }, "Abre esta página con tu sesión de claude.ai para que el diario guarde tus entrenos.")));
    } else if (!ready) {
      app.appendChild(h("div", { class: "card muted" }, S.slow ? "Tarda más de lo normal en conectar. Los datos aparecerán en cuanto responda el servidor." : "Cargando tus datos…"));
    } else if (S.tab === "cal") app.appendChild(viewCal());
    else if (S.tab === "lib") app.appendChild(viewLib());
    else app.appendChild(viewProc());
    renderModal();
    window.scrollTo(0, y);
  }
  function renderTabs() {
    var t = document.getElementById("tabs");
    t.textContent = "";
    var stEl = document.getElementById("status");
    stEl.textContent = "";
    if (db) stEl.appendChild(h("button", { class: "btn sm ghost", onclick: function () { firebase.auth().signOut().then(function () { location.reload(); }); } }, "Salir"));
    if (S.login) return;
    [["cal", "Calendario"], ["lib", "Ejercicios"], ["proc", "Proceso"]].forEach(function (x) {
      t.appendChild(h("button", { class: "tab", role: "tab", "aria-selected": S.tab === x[0] ? "true" : "false",
        onclick: function () { S.tab = x[0]; S.modal = null; render(); } }, x[1]));
    });
  }

  /* ---------- CALENDARIO ---------- */
  function groupsOf(date) {
    var w = S.workouts[date], out = [];
    if (w) w.exercises.forEach(function (e) { if (out.indexOf(e.group) < 0) out.push(e.group); });
    return out;
  }
  function viewCal() {
    var m = S.month, y = m.getFullYear(), mo = m.getMonth();
    var offset = (new Date(y, mo, 1).getDay() + 6) % 7;
    var n = new Date(y, mo + 1, 0).getDate();
    var count = 0;
